/* ---- редактор своих тем: панель с фиксированными цветами, чтобы читалась при любой теме ---- */
#ted{position:fixed;z-index:200;top:0;right:0;bottom:0;width:340px;display:flex;flex-direction:column;background:#1b1c20;color:#eceef2;border-left:1px solid #3a3c44;font:13px/1.4 system-ui,sans-serif}
#ted *{font-family:system-ui,sans-serif!important;text-transform:none!important;letter-spacing:0!important;text-shadow:none!important}
#ted .th{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid #3a3c44}
#ted .th b{flex:1;font-size:15px}
#ted .tb{flex:1;overflow-y:auto;padding:2px 12px 12px}
#ted h4{margin:14px 0 4px;font-size:11px;letter-spacing:.08em!important;text-transform:uppercase!important;color:#8d93a0}
#ted small{display:block;margin-top:8px;color:#8d93a0}
#ted .tf{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:3px 0}
#ted .tf>span{flex:1;min-width:110px}
#ted .tf b{width:22px;text-align:right}
#ted button{background:#2c2e35;color:#eceef2;border:1px solid #4a4c55;border-radius:8px;padding:7px 12px;font-weight:600;box-shadow:none;clip-path:none!important;filter:none}
#ted button.pri{background:#4f8cff;border-color:#4f8cff;color:#fff}
#ted input,#ted select,#ted textarea{background:#2a2b31;color:#eceef2;border:1px solid #4a4c55;border-radius:8px;padding:7px 9px;width:100%}
#ted .tf input,#ted .tf select{width:auto}
#ted .tf select{width:150px}
#ted input[type=color]{width:34px;height:26px;padding:0;background:none;cursor:pointer}
#ted input[type=range]{width:84px;padding:0;border:0;background:none;accent-color:#4f8cff}
#ted input[type=checkbox]{width:18px;height:18px;padding:0;accent-color:#4f8cff}
#ted textarea{margin-top:6px;resize:vertical}
#ted .tfoot{display:flex;gap:8px;padding:10px 12px;border-top:1px solid #3a3c44}
#ted .tfoot button{flex:1}
#ted .tb>.tf:last-child button{flex:1}
html.ted-open body{padding-right:340px}
html.ted-min body{padding:0!important}
#ted.min{bottom:auto;width:auto}
#ted.min .tb,#ted.min .tfoot{display:none}
@media(max-width:800px){
#ted{top:auto;left:0;width:auto;height:50dvh;border-left:0;border-top:1px solid #3a3c44;border-radius:14px 14px 0 0}
#ted.min{height:auto;top:auto;bottom:0;left:0}
html.ted-open body{padding-right:0;padding-bottom:50dvh}
}
/* анимация входа в редактор тем */
@keyframes tedIn{from{transform:translateX(100%);opacity:.4}to{transform:none;opacity:1}}
@keyframes tedUp{from{transform:translateY(100%);opacity:.4}to{transform:none;opacity:1}}
@keyframes tedItem{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#ted.in{animation:tedIn .38s cubic-bezier(.2,.8,.2,1)}
#ted .stag>*{animation:tedItem .4s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*28ms + 120ms)}
html.ted-anim body{transition:padding-right .38s cubic-bezier(.2,.8,.2,1),padding-bottom .38s cubic-bezier(.2,.8,.2,1)}
@media(max-width:800px){#ted.in{animation-name:tedUp}}
@media(prefers-reduced-motion:reduce){#ted.in,#ted .stag>*{animation:none}}

/* ---------- техподдержка ---------- */
.sup{display:flex;flex-direction:column;gap:10px}
.sup textarea{width:100%;min-height:84px;resize:vertical;background:var(--inp);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:9px 11px;outline:none;font:inherit}
.sup textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 35%,transparent)}
.sup details{border:1px solid var(--line);border-radius:var(--ir);padding:8px 10px;background:var(--hov)}
.sup summary{cursor:pointer;font-weight:600}
.sup details p{margin:6px 0 2px;color:var(--mut);font-size:.93em}
.tk{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:var(--ir);cursor:pointer;background:var(--hov);margin-bottom:6px}
.tk:hover{background:var(--on)}
.tk .tx{flex:1}
.tk .chev{color:var(--mut);font-size:20px}
.tth{display:flex;flex-direction:column;gap:6px;max-height:42dvh;overflow-y:auto}
.tmsg{max-width:92%;align-self:flex-start;padding:7px 10px;border-radius:12px;background:var(--oth);color:var(--tx);border:1px solid var(--bl,transparent);overflow-wrap:anywhere;white-space:pre-wrap}
.tmsg.me{align-self:flex-end;background:var(--mine);color:var(--mt);border-color:var(--mbl,transparent)}
.tmsg b{display:block;font-size:12px;color:var(--acc)}
.tmsg.me b{color:inherit;opacity:.8}
.tmsg small{display:block;text-align:right;opacity:.7;white-space:normal}
.tmsg.me small{color:inherit}


/* ---------- редактор группы ---------- */
#ge{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;display:none}

.gw{max-width:560px;margin:0 auto;padding:14px 14px 40px}

/* ---------- анимации сообщений ---------- */
@keyframes msgSnd{0%{opacity:0;transform:translate(26px,18px) scale(.82)}60%{opacity:1;transform:translate(-2px,-2px) scale(1.03)}100%{opacity:1;transform:none}}
@keyframes msgRcv{from{opacity:0;transform:translate(-26px,12px) scale(.88)}to{opacity:1;transform:none}}

.bub.upd{animation:msgUpd .7s ease-out}
.nt.swap{animation:txtIn .3s ease-out}

.it{position:relative}

}

// анимация «Добро пожаловать» после регистрации
function showWelcome(login) {
  const w = h('div'), lg = h('div', null, 'lg'), img = new Image(), btn = h('button', 'Начать'), p = h('p');
  w.id = 'wlc'; img.src = LOGO; img.alt = 'Рейс мессенджер'; lg.append(h('i'), h('i'), img);
  for (let k = 0; k < 14; k++) { const b = h('span', null, 'wb'), s = 6 + Math.random() * 16; b.style.cssText = `left:${Math.random() * 100}%;width:${s}px;height:${s}px;animation-duration:${5 + Math.random() * 5}s;animation-delay:${Math.random() * 3}s`; w.append(b); }
  const nm = h('b'); nm.textContent = login; p.append('Аккаунт создан: ', nm);
  w.append(lg, h('small', 'Добро пожаловать в', 't1'), h('h1', 'Рейс мессенджер'), p, btn);
  const born = Date.now(), MIN = 2800; // первые ~2.8 с анимация проигрывается и не закрывается от случайного тапа/Enter
  const close = (force) => { if (!w.isConnected || w.classList.contains('out')) return; if (!force && Date.now() - born < MIN) return; w.classList.add('out'); setTimeout(() => w.remove(), 1100); };
  w.onclick = () => close(); btn.onclick = e => { e.stopPropagation(); close(); }; setTimeout(() => close(true), 10000);
  document.addEventListener('keydown', function esc(e) { if (!w.isConnected) return document.removeEventListener('keydown', esc); if (e.key === 'Escape' || e.key === 'Enter') close(); });
  document.body.append(w);
}
async function auth(mode) {
  try {
    const login = $('#login').value.trim(), d = await api('/api/auth', { json: { mode, login, password: $('#pass').value } });
    token = localStorage.t = d.token; start(); if (mode === 'register') showWelcome(login);
  } catch (e) { $('#err').textContent = e.error || 'Ошибка соединения'; }
}
$('#in').onclick = () => auth('login');
$('#reg').onclick = () => auth('register');
$('#pass').onkeydown = e => { if (e.key === 'Enter') auth('login'); };

// ---------- помощники UI ----------
function av(n, url, s = 40) {
  const d = document.createElement('div');
  d.className = 'av';
  d.style.cssText = `width:${s}px;height:${s}px;background:hsl(${[...n].reduce((a, c) => a + c.charCodeAt(0), 0) * 37 % 360},45%,42%)`;
  if (url) { const i = new Image(); i.src = url; d.append(i); } else d.textContent = n[0].toUpperCase();
  return d;
}
const peer = c => c.members.find(x => x !== me.nick);
let blocked = new Set(); // кого я заблокировал
const isBlockedDm = c => !!c && c.type === 'dm' && blocked.has(peer(c));
function updBlockBar() { // вместо поля ввода: плашка «Вы заблокировали …» с кнопкой «Разблокировать»
  let bb = $('#blkbar');
  if (!bb) { bb = h('div'); bb.id = 'blkbar'; const t = h('span'), b = h('button', 'Разблокировать', 'sec'); b.type = 'button'; b.onclick = () => toggleBlock(peer(cur), false); bb.append(t, b); $('#bar').before(bb); }
  bb.hidden = !isBlockedDm(cur);
  if (!bb.hidden) bb.firstChild.textContent = '🚫 Вы заблокировали ' + cur.peers[peer(cur)].name;
}
async function toggleBlock(nick, on) {
  try { const r = await api('/api/block', { json: { nick, on } }); blocked = new Set(r.blocked || []); if (cur) head(); refresh(); return true; }
  catch (e) { alert(e.error || 'Не удалось'); return false; }
}

function dropChat(id) { chats = chats.filter(x => x.id !== id); archived.delete(id); pinned.delete(id); delete unread[id]; if (cur && cur.id === id) closeChat(); refresh(); }

    const dm = c.type === 'dm', d = h('dialog', null, 'cf'), col = h('div'), cancel = h('button', 'Отмена', 'sec'); let done = false;
    col.style.cssText = 'display:flex;flex-direction:column;gap:8px;margin-top:12px';

// создание GIF: выбираем кусок видео (до 6 секунд), он записывается без звука и сохраняется в «Мои GIF»
async function gifMaker(f) {
  const d = $('#att'), url = URL.createObjectURL(f), t = ftype(f);
  const note = h('div', null, 'note'), row = h('div', null, 'row'), ok = h('button', 'Создать GIF'), cn = h('button', 'Отмена', 'sec');
  let rec = false, dur = 0;

  const fail = x => { rec = false; note.textContent = (x && x.error) || 'Не удалось'; ok.disabled = false; ok.textContent = 'Создать GIF'; };
  cn.onclick = done; d.textContent = ''; d.append(h('b', 'Новый GIF'));

    const i = h('img', null, 'pv'); i.src = url; d.append(i, h('small', 'GIF сохранится как есть')); make = async () => f;
  } else {

    v.src = url; v.muted = v.loop = v.playsInline = true; st.type = ln.type = 'range'; st.step = ln.step = '0.1'; st.value = 0;
    l1.className = l2.className = 'gmr'; l1.append(st); l2.append(ln); d.append(v, l1, l2);
    const play = () => { v.currentTime = +st.value; v.play().catch(() => {}); };
    v.ontimeupdate = () => { if (!rec && v.currentTime >= +st.value + +ln.value) v.currentTime = +st.value; };
    st.oninput = ln.oninput = play;
    v.onloadedmetadata = () => {
      dur = v.duration;
      if (!isFinite(dur) || dur <= 0) { note.textContent = 'Не удалось прочитать видео'; ok.disabled = true; return; }
      st.max = Math.max(0, dur - .5).toFixed(1); ln.min = Math.min(1, dur).toFixed(1); ln.max = Math.min(6, dur).toFixed(1); ln.value = Math.min(4, dur).toFixed(1); play();
    };
    make = async () => {
      const s = +st.value, L = +ln.value, can = v.captureStream && window.MediaRecorder;
      const mime = can && ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
      if (!mime) {
        if (!/^video\/(mp4|webm)$/.test(t)) throw { error: 'В этом браузере нельзя обрезать такое видео: нужен mp4 или webm' };
        if (dur > 10 || f.size > 8e6) throw { error: 'В этом браузере видео нельзя обрезать: выберите ролик до 10 секунд и 8 МБ' };
        return f;
      }
      rec = true; ok.textContent = 'Запись…'; v.pause(); v.loop = false;
      const need = Math.abs(v.currentTime - s) > .05; v.currentTime = s;
      if (need) await new Promise(r => { v.onseeked = r; setTimeout(r, 1500); });
      const mr = new MediaRecorder(v.captureStream(), { mimeType: mime, videoBitsPerSecond: 1.5e6 }), chunks = [];
      mr.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
      const stopped = new Promise(r => { mr.onstop = r; });
      mr.start(); await v.play();
      await new Promise(r => { const ck = () => (v.currentTime >= s + L || v.ended ? r() : requestAnimationFrame(ck)); ck(); });
      v.pause(); mr.stop(); await stopped;
      return new File([new Blob(chunks, { type: 'video/webm' })], 'gif.webm', { type: 'video/webm' });
    };
  }
  ok.onclick = async () => {
    ok.disabled = true; ok.textContent = 'Создаю…';
    try { const file = await make(); ok.textContent = 'Загрузка…'; const r = await upload(file); await api('/api/gifs', { json: { url: r.url } }); done(); drawStickers(); }
    catch (x) { fail(x); }
  };
  row.append(ok, cn); d.append(note, row); d.showModal();
}

// ---------- realtime ----------
function connect() {
  const es = new EventSource('/events?token=' + token);
  es.onmessage = e => {
    const d = JSON.parse(e.data);
    if (d.t === 'chat') { addChat(d.chat); refresh(); if (cur && cur.id === d.chat.id) E2E.paint(cur); }
    if (d.t === 'msg') incoming(d.chat, d.msg);
    if (d.t === 'react') applyReact(d.chat, d.id, d.react);
    if (d.t === 'del') removeMsgs(d.chat, d.ids);
    if (d.t === 'edit') applyEdit(d.chat, d.msg);
    if (d.t === 'chatgone') dropChat(d.chat); // чат удалили у всех
  };
}

// единая точка входа для сообщений (отправка, SSE, опрос); дубли отбрасываются по id
function incoming(chatId, m) {
  if (seen.has(m.id)) return;
  seen.add(m.id);
  if (cur && cur.id === chatId) addMsg(m);
  else if (m.from !== me.nick) unread[chatId] = (unread[chatId] || 0) + 1;
  const i = chats.findIndex(x => x.id === chatId);
  if (i > 0) chats.unshift(...chats.splice(i, 1));
  refresh();
}

    changed: '⚠️ Ключ собеседника изменился — нажмите, чтобы проверить',
    missing: '⚠️ У собеседника пропал ключ шифрования — сообщения не отправляются',

    missing: 'У собеседника пропал ключ шифрования. Сообщение не отправлено, чтобы оно не ушло открытым текстом.',

  async function publish() { await api('/api/e2e/key', { json: { key: st.pub } }); me.e2e = st.pub; st.state = 'ready'; }

  function stateOf(c) {

    const bits = await S.deriveBits({ name: 'ECDH', public: pub }, mine.key, 256);

    if (m && m.reply && m.reply.enc) { const o = get(m.reply.id); m.reply.text = o && o.text ? o.text.slice(0, 100) : '🔒 Зашифрованное сообщение'; }
  };

  async function restore(text, pass) {

  function reopen() { if (cur) { const c = chats.find(x => x.id === cur.id) || cur; openChat(c); } }

// единая точка входа для сообщений: сначала расшифровка (по очереди, чтобы не нарушить порядок), затем обычная обработка

}

function removeMsgs(chat, ids) {
  if (!cur || cur.id !== chat) return;
  ids.forEach(i => { msgData.delete(i); const e = document.querySelector('#msgs .m[data-id="' + i + '"]'); if (e && !e.classList.contains('gone')) delMsgAnim(e); });
}
setInterval(() => {
  if (!cur || !cur.ttl) return;
  const now = Date.now(); [...msgData].forEach(([i, m]) => { if (now - m.ts > cur.ttl * 1000) removeMsgs(cur.id, [i]); });
}, 15000);

function seenAgo(ts) {
  const m = Math.floor((Date.now() - ts) / 60000); if (m < 1) return 'только что'; if (m < 60) return m + ' мин назад';
  const now = new Date(), t = new Date(ts), hm = t.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  if (now.toDateString() === t.toDateString()) return 'сегодня в ' + hm;
  if (new Date(now - 864e5).toDateString() === t.toDateString()) return 'вчера в ' + hm;
